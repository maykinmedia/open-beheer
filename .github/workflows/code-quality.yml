name: Code quality checks

# Run this workflow every time a new commit pushed to your repository
on:
  push:
    branches:
      - main
      - stable/*
    tags:
    paths:
      - "**.py"
      - "**.json"
      - "**.yaml"
      - "**.yml"
      - "**.in"
  pull_request:
    paths:
      - "**.py"
      - "**.json"
      - "**.yaml"
      - "**.yml"
      - "**.in"
  workflow_dispatch:

jobs:
  migrations:
    name: Check for model changes not present in migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3
        with:
          apt-packages: "gettext postgresql-client"
          python-version: "3.12"
          setup-node: "no"
          working-directory: backend
      - name: Run makemigrations to check for missing migrations
        working-directory: backend
        run: |
          src/manage.py makemigrations \
            --check \
            --dry-run
        env:
          DJANGO_SETTINGS_MODULE: "openbeheer.conf.ci"
          DEBUG: "true"
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_NAME: postgres
          DB_PASSWORD: ""

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
      - name: Linting
        run: ruff check
      - name: Check formatting
        run: ruff format --check

  type-checking:
    name: Type checking (Pyright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "backend/requirements/type-checking.txt"
      - name: Install required (stub-)packages
        run: |
          uv pip install \
            --system \
            -r requirements/type-checking.txt
        working-directory: backend
      - uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef
        with:
          version: 1.1.405
          project: pyright-ci-pyproject.toml

  backend-oas:
    name: Check backend OAS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3
        with:
          apt-packages: "gettext"
          python-version: "3.12"
          setup-node: "no"
          working-directory: backend

      - name: Generate OAS
        working-directory: backend
        run: |
          src/manage.py spectacular \
          --validate \
          --fail-on-warn \
          --lang=en \
          --file openbeheer-oas.yaml
        env:
          DJANGO_SETTINGS_MODULE: openbeheer.conf.ci
          SECRET_KEY: dummy

      - name: Check for OAS changes
        run: |
          git diff --exit-code openbeheer-oas.yaml
        shell: bash
        working-directory: backend

  frontend-types:
    name: Check frontend types
    runs-on: ubuntu-latest
    needs: backend-oas

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: "frontend/.nvmrc"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check types
        run: npm run check-types
